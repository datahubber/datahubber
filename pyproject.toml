[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "datahubber-profile"
version = "0.1.0"
description = "GitHub profile README plus the generator for its Kaggle medal board."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mian Wang" }]
requires-python = ">=3.10"
dependencies = []  # the generator uses the standard library only

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.9"]

[tool.setuptools]
py-modules = []  # nothing to install: scripts/ run in place, tests import them via pythonpath

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["medals", "make_medal_board"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
